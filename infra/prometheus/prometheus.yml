global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'airouter-monitor'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  - job_name: 'airouter-backend'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: 'airouter'
          environment: 'development'
    metrics_path: '/metrics'

