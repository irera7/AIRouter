# AIRouter Nginx Configuration
# This configuration sets up a reverse proxy for both frontend and backend

# Upstream backend server
upstream airouter_backend {
    server localhost:3000;
    keepalive 64;
}

# Upstream frontend server
upstream airouter_frontend {
    server localhost:3001;
    keepalive 64;
}

# HTTP Server - Redirect to HTTPS (optional, uncomment when SSL is ready)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name nexairalab.net airouter.rera.work;
#     
#     # Redirect all HTTP traffic to HTTPS
#     return 301 https://$server_name$request_uri;
# }

# Main Server Block (HTTP for now, HTTPS when ready)
server {
    listen 80;
    listen [::]:80;
    server_name nexairalab.net airouter.rera.work;

    # For SSL (uncomment when you have certificates)
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/nexairalab.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nexairalab.net/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/airouter-access.log;
    error_log /var/log/nginx/airouter-error.log;

    # Max upload size (for large requests)
    client_max_body_size 10M;

    # Backend API routes
    location /api/ {
        proxy_pass http://airouter_backend;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts for long-running AI requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://airouter_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js application
    location / {
        proxy_pass http://airouter_frontend;
        proxy_http_version 1.1;
        
        # WebSocket support for Next.js HMR (Hot Module Replacement)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Next.js specific
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Next.js static files and chunks
    location /_next/static/ {
        proxy_pass http://airouter_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache static files for 1 year
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js public files
    location /public/ {
        proxy_pass http://airouter_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Cache public files
        expires 7d;
        add_header Cache-Control "public";
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://airouter_frontend;
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        proxy_pass http://airouter_frontend;
        log_not_found off;
        access_log off;
    }
}

# Additional server block for www subdomain (optional)
server {
    listen 80;
    listen [::]:80;
    server_name www.nexairalab.net www.airouter.rera.work;
    
    # Redirect www to non-www
    return 301 $scheme://nexairalab.net$request_uri;
}

